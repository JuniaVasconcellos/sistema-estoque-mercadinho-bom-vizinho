{% extends 'base.html' %}{% block content %}<h1>Registrar movimentação</h1><p>Informe os dados da entrada ou saída.</p><form method="post" class="form"><label for="produto_id">Produto *</label><select id="produto_id" name="produto_id" required><option value="">Selecione</option>{% for p in produtos %}<option value="{{ p.id_produto }}">{{ p.nome }} — saldo {{ p.quantidade_atual }}</option>{% endfor %}</select><fieldset><legend>Tipo de movimentação *</legend><label><input type="radio" name="tipo" value="ENTRADA" required> Entrada</label><label><input type="radio" name="tipo" value="SAIDA"> Saída</label></fieldset><label for="quantidade">Quantidade *</label><input id="quantidade" name="quantidade" type="number" min="1" required><small>Informe um número inteiro maior que zero.</small><label for="observacao">Observação</label><textarea id="observacao" name="observacao" maxlength="250"></textarea><button type="submit">Confirmar movimentação</button></form>{% endblock %}
