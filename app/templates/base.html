<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Controle de Estoque{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><header><div><strong>Mercadinho Bom Vizinho</strong><small>Controle de Estoque</small></div><a href="{{ url_for('main.index') }}">Início</a></header><main>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="message {{ cat }}" role="alert">{{ msg }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
