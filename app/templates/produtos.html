{% extends 'base.html' %}{% block content %}<h1>Cadastrar produto</h1><form method="post" class="form"><label for="nome">Nome *</label><input id="nome" name="nome" required maxlength="100"><label for="categoria">Categoria *</label><input id="categoria" name="categoria" required maxlength="60"><label for="preco">Preço *</label><input id="preco" name="preco" type="number" min="0" step="0.01" required><label for="quantidade">Quantidade inicial *</label><input id="quantidade" name="quantidade" type="number" min="0" required><label for="minimo">Estoque mínimo *</label><input id="minimo" name="minimo" type="number" min="0" required><label for="validade">Data de validade</label><input id="validade" name="validade" type="date"><button type="submit">Salvar produto</button></form>{% endblock %}
